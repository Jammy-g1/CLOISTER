<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>CLOISTER</title>

    <link rel="stylesheet" href="assets/css/theme.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/components.css">

</head>

<body>

<div id="app">

    <!-- TOP BAR -->

    <header>

        <div id="logo">

            CLOISTER

        </div>

        <div id="toolbar">
            <button id="toggleExplorer">☰ Explorer</button>

            <button id="pointerTool">Pointer</button>

            <button id="drawTool">Draw</button>

            <button id="panTool">Pan</button>

            <button id="deleteTool">Delete</button>

            <button id="saveButton">Save</button>

            <button id="exportButton">Export</button>

        </div>

        <div id="headerRight">

            <select id="floorSelector"></select>

            <input
                id="search"
                placeholder="Search...">

        </div>

    </header>

    <!-- MAIN -->

<main>

    <!-- Explorer -->

    <aside id="explorer">

        <h3>Explorer</h3>

        <div id="buildingTree">

            Loading...

        </div>

    </aside>


        <!-- Viewport -->

<section id="viewport">

    <div id="viewportWrapper">

        <div id="mapContainer">

            <div id="svgContainer">

                Loading map...

            </div>

        </div>

    </div>

</section>

        <!-- Properties -->

        <aside id="properties">

            <h3>Properties</h3>

        <div id="propertyContent">

            <div class="property-group">
                <label for="roomId">Room ID</label>
                <input id="roomId" type="text" disabled>
            </div>

            <div class="property-group">
                <label for="roomName">Friendly Name</label>
                <input id="roomName" type="text" disabled>
            </div>

            <div class="property-group">
                <label>Tags</label>
                <div id="roomTags" class="property-box">None</div>
            </div>

            <div class="property-group">
                <label for="roomNotes">Notes</label>
                <textarea id="roomNotes" rows="8" disabled></textarea>
            </div>

            <div class="property-group">

                <label>Images</label>

                <input
                    type="file"
                    id="roomImage"
                    accept="image/*"
                    multiple>

                <div id="roomImages"></div>

            </div>

        </div>

        </aside>

    </main>

    <!-- STATUS BAR -->

    <footer>

        <span id="status">

            Ready

        </span>

        <span id="version">

            CLOISTER v0.4.0

        </span>

    </footer>

</div>

<input
    type="file"
    id="importFile"
    accept=".json"
    style="display:none;">

<img
    id="roomImages"
    style="max-width:100%; margin-top:10px; display:none;">

<script src="assets/js/application.js"></script>
<script src="assets/js/building.js"></script>
<script src="assets/js/room.js"></script>
<script src="assets/js/roomEditor.js"></script>
<script src="assets/js/app.js"></script>

</body>
</html>
